    path: "make"
    args: ["slam"]
    module: "build"
    description: "Build SLAM tools"

# Test suites (grouped by module, with disk space requirements)
test_suites:
  - module: "core"
    description: "Core STAR / Solo tests (non-Flex)"
    scripts: ["cbub_regression", "sorted_bam_cbub_nonflex", "unsorted_cbub_smoke"]
    disk_space_min_gb: 20

  - module: "flex"
    description: "STAR-Flex tests"
    scripts: ["flex_smoke", "flex_cbub_validation", "flex_multisample", "flex_tiny_public", "cbq_flex_tiny_public", "flex_yremove", "flex_cr_config"]
    disk_space_min_gb: 20

  - module: "cr-compat"
    description: "CellRanger compatibility tests"
    scripts: ["crispr_calling", "a375_gex_features_cr_parity", "cr_compat_unit", "cr_compat_integration", "cr_parity_100k"]
    disk_space_min_gb: 100

  - module: "parity"
    description: "EmptyDrops parity checks (core + flex)"
    scripts: ["emptydrops_parity", "flexfilter_parity"]
    disk_space_min_gb: 100

  - module: "feature-tools"
    description: "Feature barcode tools tests"
    scripts: ["assignbarcodes_regression"]
    disk_space_min_gb: 20

  - module: "slam"
    description: "SLAM-seq tests"
    scripts: ["slam_e2e_fixture", "slam_compat", "slam_unit", "slam_solver", "slam_fixture_parity", "slam_requant_parity"]
    disk_space_min_gb: 20

  - module: "slam-pe-smoke"
    description: "SLAM paired-end 100K SE/PE smoke (requires local NW R1/R2 dataset)"
    scripts: ["slam_pe_100k_smoke"]
    disk_space_min_gb: 50

  - module: "slam-e2e"
    description: "SLAM full-depth E2E tests (require /storage SLAM data)"
    scripts: ["slam_e2e", "slam_e2e_vb_commonmask", "downsample_10m_gedi"]
    disk_space_min_gb: 100

  - module: "tier-a"
    description: "Self-contained Tier-A tests (no external data, container-safe)"
    scripts: ["adapter_clip_synthetic", "genome_generate_validation", "binary_test_matrix"]
    disk_space_min_gb: 5

  - module: "ychrom"
    description: "Y-chromosome removal and BAM splitting tests"
    scripts: ["ychrom_regression", "ychrom_bulk_pe", "ychrom_bam_split", "remove_y_reads"]
    disk_space_min_gb: 20

  - module: "ucsf"
    description: "UCSF perturb-seq smoke tests"
    scripts: ["ucsf_100k_smoke", "ucsf_velocyto_100k", "ucsf_solo_gex_100k"]
    disk_space_min_gb: 50

  - module: "bulk"
    description: "Bulk RNA-seq tests"
    scripts: ["public_bulk_pe"]
    disk_space_min_gb: 20

  - module: "regression"
    description: "Parameter regression test suite"
    scripts: ["parms_tests"]
    disk_space_min_gb: 20

  - module: "production-module-regression"
    description: "Manifest-driven production-file regression suite across STAR-suite modules"
    scripts: ["production_module_regression"]
    disk_space_min_gb: 100

# Required binaries for preflight checks
required_binaries:
  - name: "STAR"
    paths:
      - "core/legacy/source/STAR"
      - "/usr/local/bin/STAR"
  - name: "samtools"
    paths:
      - "/usr/bin/samtools"
      - "/usr/local/bin/samtools"

# Build settings
build:
  # Auto-rebuild if sources changed (checked during preflight)
  auto_check_stale: true
  
  # Recommend clean build before test suites
  recommend_clean_for_tests: true
  
  # Build state tracking file (relative to repo root)
  state_file: ".star_build_state.json"
  
  # Source directories to hash for change detection (per target)
  source_dirs:
    core:
      - "core/legacy/source"
      - "flex/source"
      - "slam/source"
      - "core/features"
    flex:
      - "flex/source"
      - "core/features/libscrna"
    slam:
      - "slam/source"
    feature-tools:
      - "core/features/feature_barcodes"
      - "core/features/process_features"
