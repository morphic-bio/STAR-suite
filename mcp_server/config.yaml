# STAR-suite MCP Server Configuration

# Agent usage protocol (provenance-first + compose-up), surfaced to agents on MCP
# workflow discovery (list_workflows / describe_workflow). The server ships a
# self-contained, LAB-AGNOSTIC built-in default — DEFAULT_AGENT_PROTOCOL in
# mcp_server/schemas/config.py — so it needs nothing else to run. That template is
# kept in sync with the canonical text at
# morphic-recipes/docs/authoring/agent_protocol.txt by
# morphic-recipes/tests/check_agent_protocol_sync.py.
#
# LOCALIZE for your site by filling the protocol's ${PROVENANCE_ROOT} /
# ${RECIPES_ROOT} placeholders here (defaults mirror morphic's, see
# morphic-recipes/docs/authoring/localization.example.yaml):
#
# locations:
#   PROVENANCE_ROOT: /path/to/your/provenance
#   RECIPES_ROOT: /path/to/your/recipes
#
# To replace the protocol wording entirely (rare), set an `agent_protocol: |` block.
# Left unset, the built-in template + DEFAULT_LOCATIONS are used.

server:
  host: "0.0.0.0"
  port: 8765
  auth_token: "${MCP_AUTH_TOKEN}"  # Set via environment variable
  transport: "http"  # "http" or "stdio"
  public_discovery: true  # Discovery tools don't require auth

paths:
  repo_root: "/mnt/pikachu/STAR-suite"
  artifact_log_root: "/mnt/pikachu/STAR-suite/plans/artifacts"
  temp_root: "/tmp"

# Optional external recipe catalogs, loaded in declared discovery order. Each
# manifest uses schema biodepot.recipe_catalog/v1. Relative manifest and
# provenance paths resolve from this config file's directory. Duplicate catalog
# ids, namespaces, and workflow ids fail closed; external workflow paths must
# stay within their catalog root.
#
# recipe_catalogs:
#   - manifest: /opt/star-suite/share/star-suite/catalogs/official/catalog.yaml
#     trust: trusted
#   - manifest: /etc/star-suite/recipes/catalog.yaml
#     trust: trusted
recipe_catalogs:
  - manifest: ../share/star-suite/catalogs/official/catalog.yaml
    trust: trusted

# A logical recipe may be supplied by several catalogs. Fully qualified source
# identities are always preserved. keep_separate (the safe default) requires a
# source-specific id, prompt returns structured candidates for an interactive
# client, and prefer_newest selects the highest PEP 440 recipe version (ties use
# later catalog order). Temporal consumes a resolved lock and does not apply a
# discovery policy itself.
recipe_resolution:
  default_policy: keep_separate
  applications:
    cli: keep_separate
    workbench: prompt
#   unattended-builder: prefer_newest

# Provenance repositories are independent of recipe catalogs. Search roots are
# read in order; a context has at most one explicit write destination. Reusing a
# search id for write is allowed only when it names the same root.
#
# provenance:
#   search:
#     - id: site
#       root: /shared/star-suite-provenance
#     - id: project
#       root: .star-suite/provenance
#   write:
#     id: project
#     root: .star-suite/provenance
provenance:
  search:
    - id: official-evidence
      root: ../share/star-suite/evidence/official

trusted_roots:
  - "/mnt/pikachu/STAR-suite"
  - "/mnt/pikachu/morphic-recipes"
  - "/mnt/pikachu/morphic-provenance"
  - "/mnt/pikachu/prod-12-28"
  - "/mnt/pikachu/ucsf-perturb-seq-corrected"
  - "/mnt/pikachu/ucsf-perturb-seq"
  - "/mnt/pikachu/JAX_scRNAseq02"
  - "/mnt/pikachu/JAX_scRNAseq02_processed"
  - "/mnt/pikachu/scRNAseq_40KO"
  - "/mnt/pikachu/MSK_40KO_processed"
  - "/mnt/pikachu/msk40ko-bam-archive"
  - "/mnt/pikachu/SLAM-Seq"
  - "/mnt/pikachu/SLAM-Seq-PE-results"
  - "/mnt/pikachu/slam_blank_artifacts_20260201"
  - "/storage"
  - "/tmp"
  - "/usr/bin"        # read-only for tool discovery
  - "/usr/local/bin"  # read-only for tool discovery

datasets:
  - id: "a375"
    path: "/storage/A375"
    description: "A375 cell line data (GEX + features)"
    metadata_file: "dataset.yaml"  # optional
  - id: "sc2300771"
    path: "/mnt/pikachu/prod-12-28/SC2300771"
    description: "SC2300771 production run (Flex MEX + per-sample summaries)"
  - id: "slam_seq_pe"
    path: "/mnt/pikachu/SLAM-Seq"
    description: "NW SLAM-seq paired-end R1/R2 panel used by 2026-05 PE smoke and production runs"
  - id: "jax_scrnaseq02_ocm"
    path: "/mnt/pikachu/JAX_scRNAseq02"
    description: "JAX GEM-X OCM scRNA-seq panel with six OCM library sets"
  - id: "msk_40ko"
    path: "/mnt/pikachu/scRNAseq_40KO"
    description: "MSK 40KO GEX/PolyIII/LARRY perturb-seq FASTQ panel"
  # Add more datasets as discovered from /storage scan

execution:
  default_timeout_seconds: 7200  # 2 hours
  max_concurrent_jobs: 1
  queue_max_size: 10

# Disk space thresholds (per-suite configurable)
disk_space:
  default_min_gb: 20           # smoke tests
  full_depth_min_gb: 100       # full A375/GeneFull runs

# Structured workflow templates (agent-facing parameter surface)
# visibility: public (default) or private (requires auth_token to discover)
workflows:
  - id: "ucsf_star_suite_production"
    title: "UCSF STAR-suite Production Workflow"
    summary: "Corrected UCSF GEX+guide workflow with optional downstream and remote CellBender stages."
    entry_script: "scripts/paper/run_ucsf_corrected_production_workflow.sh"
    kind: "shell_workflow"
    schema_file: "mcp_server/workflows/ucsf_star_suite_production.yaml"

  # --- Public STAR CLI recipes (single argv = STAR; see README Sample Commands) ---
  - id: star_genome_generate
    title: STAR genome index (genomeGenerate)
    summary: One STAR command to build a genome index (--runMode genomeGenerate).
    entry_script: core/legacy/source/STAR
    kind: star_cli
    schema_file: mcp_server/workflows/star_genome_generate.yaml
    visibility: public

  - id: star_bulk_pe_batch
    title: STAR bulk RNA-seq (PE batch)
    summary: One STAR alignReads command with --batchMode 1 and paired comma-separated mate lists.
    entry_script: core/legacy/source/STAR
    kind: star_cli
    schema_file: mcp_server/workflows/star_bulk_pe_batch.yaml
    visibility: public

  - id: star_binseq_pe_batch
    title: STAR BINSEQ/CBQ paired-end batch
    summary: One STAR alignReads command for paired CBQ inputs with --readFilesType Binseq PE and optional --batchMode.
    entry_script: core/legacy/source/STAR
    kind: star_cli
    schema_file: mcp_server/workflows/star_binseq_pe_batch.yaml
    visibility: public

  - id: star_scrna_solo_droplet
    title: STARsolo droplet scRNA-seq
    summary: One STAR alignReads command for droplet scRNA-seq (--soloType Droplet + whitelist).
    entry_script: core/legacy/source/STAR
    kind: star_cli
    schema_file: mcp_server/workflows/star_scrna_solo_droplet.yaml
    visibility: public

  - id: star_flex_fixed_rna
    title: STAR-Flex (Fixed RNA Profiling)
    summary: One STAR alignReads command with --flex yes and Fixed RNA whitelist layout.
    entry_script: core/legacy/source/STAR
    kind: star_cli
    schema_file: mcp_server/workflows/star_flex_fixed_rna.yaml
    visibility: public

  - id: star_flex_fixed_rna_cbq
    title: STAR-Flex Fixed RNA CBQ
    summary: One STAR alignReads command with --readFilesType Binseq PE, paired CBQ input, and --flex yes.
    entry_script: core/legacy/source/STAR
    kind: star_cli
    schema_file: mcp_server/workflows/star_flex_fixed_rna_cbq.yaml
    visibility: public

  - id: star_perturb_cr_compat
    title: STAR-perturb (CR-compat alignReads)
    summary: One STAR alignReads command with --pfMultiConfig and CR-compat threading defaults.
    entry_script: core/legacy/source/STAR
