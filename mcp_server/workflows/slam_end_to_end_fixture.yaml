# Canonical pinned SLAM fixture parity workflow.

id: "slam_end_to_end_fixture"
title: "SLAM Pinned Fixture Parity"
summary: "Manifest-verified STAR-SLAM parity and dump-requant replay using the 100K fixture."
kind: "shell_workflow"
entry_script: "tests/run_slam_parity_smoke.sh"
supported_modes:
  - "local"
caveats:
  - "Requires the external 100K FASTQ, noSNP reference, SNP BED, and exact pinned STAR index."
  - "The fixture manifest fails before alignment if an artifact, index, or required STAR option has drifted."
  - "Loading the full index requires roughly 30 GB RAM and can dominate this small fixture's runtime."
default_output_layout: "/tmp/slam_parity_smoke_<timestamp>/"

stages:
  - name: "fixture_preflight"
    title: "Fixture Contract Preflight"
    description: "Verify content fingerprints, index identity, and the effective STAR alignment contract."
  - name: "alignment"
    title: "STAR-SLAM Alignment"
    description: "Align with pinned adapter clipping and emit the quantification replay sidecars."
  - name: "reference_parity"
    title: "GRAND-SLAM Reference Parity"
    description: "Gate NTR correlation against the pinned noSNP reference."
  - name: "requant_parity"
    title: "Dump-Requant Parity"
    description: "Replay dump and weight sidecars and gate exact pre-NTR parity."

parameter_groups:
  - name: "paths"
    title: "Paths"
    parameters: ["outdir", "star_bin", "requant_bin", "fastq", "genome_dir", "snp_bed", "reference", "fixture_manifest"]
  - name: "thresholds"
    title: "Parity Thresholds"
    parameters: ["ref_corr_min", "exact_min_pearson", "exact_max_abs_delta", "align_min_pearson"]
  - name: "execution"
    title: "Execution"
    parameters: ["threads", "no_reference", "no_requant", "no_fixture_manifest", "compare_only"]

parameters:
  - name: "outdir"
    cli_flag: "--outdir"
    type: "directory"
    required: false
    description: "Fresh output root for STAR, comparisons, commands, and logs."
    is_output_root: true

  - name: "star_bin"
    cli_flag: "--star-bin"
    type: "file"
    required: false
    description: "STAR-suite binary."

  - name: "requant_bin"
    cli_flag: "--requant-bin"
    type: "file"
    required: false
    description: "slam_requant binary."

  - name: "fastq"
    cli_flag: "--fastq"
    type: "file"
    required: false
    description: "Pinned 100K SRR32576116 FASTQ."

  - name: "genome_dir"
    cli_flag: "--genome-dir"
    type: "directory"
    required: false
    description: "Pinned STAR genome index."

  - name: "snp_bed"
    cli_flag: "--snp-bed"
    type: "file"
    required: false
    description: "Pinned fixture SNP BED."

  - name: "reference"
    cli_flag: "--reference"
    type: "file"
    required: false
    description: "Pinned noSNP GRAND-SLAM reference."

  - name: "fixture_manifest"
    cli_flag: "--fixture-manifest"
    type: "file"
    required: false
    description: "Immutable fixture, index, and STAR-command contract."

  - name: "threads"
    cli_flag: "--threads"
    type: "int"
    default: 4
    description: "STAR worker threads."

  - name: "ref_corr_min"
    cli_flag: "--ref-corr-min"
    type: "float"
    default: 0.99
    description: "Minimum reference NTR Pearson correlation."

  - name: "exact_min_pearson"
    cli_flag: "--exact-min-pearson"
    type: "float"
    default: 0.999999
    description: "Minimum exact dump/weight replay Pearson correlation."

  - name: "exact_max_abs_delta"
    cli_flag: "--exact-max-abs-delta"
    type: "float"
    default: 0.000001
    description: "Maximum exact replay absolute delta."

  - name: "align_min_pearson"
    cli_flag: "--align-min-pearson"
    type: "float"
    default: 0.98
    description: "Minimum recomputed-alignment replay Pearson correlation."

  - name: "no_reference"
    cli_flag: "--no-reference"
    type: "bool"
    default: false
    description: "Skip the GRAND-SLAM reference comparison."

  - name: "no_requant"
    cli_flag: "--no-requant"
    type: "bool"
    default: false
    description: "Skip dump-requant replay checks."

  - name: "no_fixture_manifest"
    cli_flag: "--no-fixture-manifest"
    type: "bool"
    default: false
    description: "Explicitly disable pinned fixture verification for non-regression experiments."

  - name: "compare_only"
    cli_flag: "--compare-only"
    type: "bool"
    default: false
    description: "Reuse outputs and the recorded STAR command already present in outdir."

rendering:
  flag_order: ["outdir", "star_bin", "requant_bin", "fastq", "genome_dir", "snp_bed", "reference", "fixture_manifest", "threads", "ref_corr_min", "exact_min_pearson", "exact_max_abs_delta", "align_min_pearson", "no_reference", "no_requant", "no_fixture_manifest", "compare_only"]
  omit_absent_optionals: true
