schema: biodepot.recipe_catalog/v1
id: starsuite-official
namespace: starsuite.official
version: "1.7.0"
workflows:
  - id: starsuite.official/slam-pe-100k-smoke
    logical_id: slam_pe_100k_smoke
    version: "1.7.0"
    title: SLAM PE 100K SE/PE Smoke
    summary: Compare matched R1-only and paired-end STAR-SLAM count surfaces.
    kind: shell_workflow
    entry_script: scripts/run_slam_100k_se_pe_smoke.sh
    schema_file: workflows/slam_pe_100k_smoke.yaml
    visibility: public
    applications: [cli, workbench, temporal]

  - id: starsuite.official/slam-pe-production
    logical_id: slam_pe_production
    version: "1.7.0"
    title: SLAM PE Production Panel
    summary: Run STAR-SLAM per sample with optional explicitly configured transfer.
    kind: shell_workflow
    entry_script: scripts/run_slam_prod_set.sh
    schema_file: workflows/slam_pe_production.yaml
    visibility: public
    applications: [cli, workbench, temporal]

  - id: starsuite.official/slam-deseq2-container
    logical_id: slam_deseq2_container
    version: "1.7.0"
    title: SLAM DESeq2 Container
    summary: Build and verify the pinned DESeq2/tximport analysis image.
    kind: shell_workflow
    entry_script: scripts/docker/build_slam_deseq2_image.sh
    schema_file: workflows/slam_deseq2_container.yaml
    visibility: public
    applications: [cli, workbench]

  - id: starsuite.official/multiome
    logical_id: multiome
    version: "1.7.0"
