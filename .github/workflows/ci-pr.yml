name: CI PR

on:
  pull_request:
    paths:
      - ".github/workflows/ci-pr.yml"
      - ".github/workflows/ci-dev-release.yml"
      - ".github/workflows/ci-master.yml"
      - ".github/workflows/release.yml"
      - "docker/**"
      - "scripts/docker/**"
      - "scripts/release/**"
      - "core/**"
      - "flex/**"
      - "slam/**"
      - "tests/**"
      - "debian/**"
      - "Makefile"
      - "README.md"
      - "docs/Github-actions.md"
      - "docs/Star-binary-distribution.md"

permissions:
  contents: read

jobs:
  build-and-tier-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify architecture-aware SIMD flags
        run: tests/run_simd_arch_flags_test.sh

      - name: Verify molecule-first production adapters
        run: tests/run_molecule_first_production_adapter_test.sh

      - name: Build suite base image
        run: |
          chmod +x scripts/docker/*.sh
          MAKE_JOBS=8 IMAGE_TAG=biodepot/star-suite:ci-pr-${{ github.sha }} \
            scripts/docker/build_image.sh

      - name: Run Tier A smoke tests
        run: |
          MAKE_JOBS=8 \
          TEST_IMAGE_TAG=biodepot/star-suite:ci-pr-tier-a-${{ github.sha }} \
            scripts/docker/run_smokes_tier_a.sh

      - name: Build ARM64 suite base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: suite-base
          platforms: linux/arm64
          push: false
          build-args: |
            MAKE_JOBS=8
            STAR_SUITE_COMMIT_SHA=${{ github.sha }}
