name: Launchpad checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  portable-launchpad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r mcp_server/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check browser JavaScript
        run: node --check mcp_server/launchpad/static/app.js
      - name: Validate bundled recipes and provenance
        run: python scripts/release/validate_official_snapshots.py
      - name: Test relocated install, input validation and browser execution
        run: python -m pytest -q mcp_server/tests/test_launchpad_portability.py mcp_server/tests/test_launchpad.py mcp_server/tests/test_workflow_validation.py mcp_server/tests/test_workflow_render.py mcp_server/tests/test_config.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchpad-browser-evidence
          path: tests/launchpad_portability_output/*.png
          if-no-files-found: ignore
