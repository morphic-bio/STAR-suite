name: CI Master

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci-pr.yml"
      - ".github/workflows/ci-dev-release.yml"
      - ".github/workflows/ci-master.yml"
      - ".github/workflows/release.yml"
      - "docker/**"
      - "scripts/docker/**"
      - "scripts/release/**"
      - "core/**"
      - "flex/**"
      - "slam/**"
      - "tests/**"
      - "debian/**"
      - "Makefile"
      - "README.md"
      - "docs/Github-actions.md"
      - "docs/Star-binary-distribution.md"

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-24.04
    outputs:
      has-docker-creds: ${{ steps.check.outputs.has-creds }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "has-creds=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-tier-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build suite base image
        run: |
          chmod +x scripts/docker/*.sh
          MAKE_JOBS=8 IMAGE_TAG=biodepot/star-suite:ci-master-${{ github.sha }} \
            scripts/docker/build_image.sh

      - name: Run Tier A smoke tests
        run: |
          MAKE_JOBS=8 \
          TEST_IMAGE_TAG=biodepot/star-suite:ci-master-tier-a-${{ github.sha }} \
            scripts/docker/run_smokes_tier_a.sh

  publish-master-images:
    needs: [build-and-tier-a, check-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: needs.check-secrets.outputs.has-docker-creds == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push master multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: suite-base
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MAKE_JOBS=8
            STAR_SUITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            biodepot/star-suite:latest
            biodepot/star-suite:master-${{ github.sha }}
