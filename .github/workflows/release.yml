name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-secrets:
    runs-on: ubuntu-24.04
    outputs:
      has-docker-creds: ${{ steps.check-docker.outputs.has-creds }}
    steps:
      - id: check-docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "has-creds=true" >> "$GITHUB_OUTPUT"
          fi

  build-release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            xxd \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            gnupg \
            pkg-config \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            libglib2.0-dev \
            libhts-dev

      - name: Build compatibility tarball (glibc 2.34 baseline)
        run: |
          chmod +x scripts/release/*.sh
          scripts/release/build_static_tarball.sh \
            --version "${GITHUB_REF_NAME}" \
            --docker-image "ubuntu:22.04" \
            --compat-label "glibc234" \
            --glibc-baseline "2.34" \
            --out-dir "dist/release"

      - name: Build compatibility tarball (glibc 2.39 baseline)
        run: |
          scripts/release/build_static_tarball.sh \
            --version "${GITHUB_REF_NAME}" \
            --docker-image "ubuntu:24.04" \
            --compat-label "glibc239" \
            --glibc-baseline "2.39" \
            --out-dir "dist/release"

      - name: Build installer bundle
        run: |
          scripts/release/build_installer_bundle.sh \
            --version "${GITHUB_REF_NAME}" \
            --tarball "dist/release/STAR-suite-${GITHUB_REF_NAME}-linux-amd64-glibc234.tar.gz" \
            --tarball "dist/release/STAR-suite-${GITHUB_REF_NAME}-linux-amd64-glibc239.tar.gz" \
            --out-dir "dist/release"

      - name: Validate direct tarball installer
        run: |
          tmpdir="$(mktemp -d)"
          tar -xzf "dist/release/STAR-suite-${GITHUB_REF_NAME}-linux-amd64-glibc234.tar.gz" -C "${tmpdir}"
          "${tmpdir}/install.sh" --prefix "${tmpdir}/prefix"
          "${tmpdir}/prefix/bin/STAR" --version

      - name: Validate installer bundle selection (older baseline)
        run: |
          scripts/release/validate_installer_bundle.sh \
            --bundle "dist/release/STAR-suite-${GITHUB_REF_NAME}-linux-amd64-installer.tar.gz" \
            --glibc-version "2.35" \
            --expected-label "glibc234"

      - name: Validate installer bundle selection (current baseline)
        run: |
          scripts/release/validate_installer_bundle.sh \
            --bundle "dist/release/STAR-suite-${GITHUB_REF_NAME}-linux-amd64-installer.tar.gz" \
            --glibc-version "2.39" \
            --expected-label "glibc239"

      - name: Build Debian binary package
        run: |
          scripts/release/build_deb_binary_package.sh \
            --out-dir "dist/release/deb"

      - name: Validate .deb install/uninstall (Ubuntu 24.04)
        run: |
          scripts/release/validate_deb_install_uninstall.sh

      - name: Build source package for PPA
        run: |
          scripts/release/build_source_package.sh \
            --out-dir "dist/release/source"

      - name: Import and sign Debian source package
        env:
          DEB_SIGNING_KEY: ${{ secrets.DEB_SIGNING_KEY }}
          DEB_SIGNING_KEY_ID: ${{ secrets.DEB_SIGNING_KEY_ID }}
          DEB_SIGNING_KEY_PASSPHRASE: ${{ secrets.DEB_SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -n "$DEB_SIGNING_KEY" ] && [ -n "$DEB_SIGNING_KEY_ID" ]; then
            export GNUPGHOME="${RUNNER_TEMP}/gnupg"
            mkdir -p "${GNUPGHOME}"
            chmod 700 "${GNUPGHOME}"
            printf '%s' "${DEB_SIGNING_KEY}" | gpg --batch --import
            echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"
            scripts/release/sign_source_package.sh \
              --in-dir "dist/release/source" \
              --key-id "${DEB_SIGNING_KEY_ID}"
          else
            echo "Skipping source package signing; configure DEB_SIGNING_KEY and DEB_SIGNING_KEY_ID to enable."
          fi

      - name: Generate checksums
        run: |
          scripts/release/create_checksums.sh "dist/release"

      - name: Upload release artifacts (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist/release/**
          if-no-files-found: error

  publish-release-images:
    needs: [build-release-artifacts, check-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: needs.check-secrets.outputs.has-docker-creds == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image-tags
        run: |
          if echo "${{ github.ref_name }}" | grep -qiE '^v0([.]|$)|[-](alpha|beta|rc|dev)'; then
            {
              echo "tags<<EOF"
              echo "biodepot/star-suite:${{ github.ref_name }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "biodepot/star-suite:${{ github.ref_name }}"
              echo "biodepot/star-suite:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: suite-base
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MAKE_JOBS=8
          tags: ${{ steps.image-tags.outputs.tags }}

  publish-github-release:
    needs:
      - build-release-artifacts
      - publish-release-images
    if: ${{ always() && needs.build-release-artifacts.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist/release

      - name: Detect prerelease from tag
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qiE '^v0([.]|$)|[-](alpha|beta|rc|dev)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
