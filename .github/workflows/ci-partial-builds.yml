name: Partial Make Regression

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partial-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [core, core-static, core-htslib, release-companion-tools, star-feature-call, feature-barcodes-tools, process-features-lib, yremove-tools]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xxd pkg-config python3 zlib1g-dev libbz2-dev \
            liblzma-dev libcurl4-gnutls-dev libssl-dev libglib2.0-dev
          # Only standalone feature tools require system HTSlib. The other
          # cases must work with STAR's bundled headers and static library.
          if [ '${{ matrix.target }}' = feature-barcodes-tools ]; then
            sudo apt-get install -y --no-install-recommends libhts-dev
          else
            if dpkg-query -W -f='${Status}' libhts-dev 2>/dev/null | grep -q 'install ok installed'; then
              sudo apt-get remove -y libhts-dev
            fi
          fi
      - name: Check dependency generation and discovery
        run: |
          python3 tests/test_parameters_default_generation.py
          python3 tests/test_htslib_build_discovery.py
          python3 tests/test_scrna_regression_report.py
      - name: Build target from a fresh source export
        env:
          MAKE_JOBS: "4"
          OUT_ROOT: ${{ runner.temp }}/partial-build
        run: bash tests/run_partial_make_regression.sh '${{ matrix.target }}'
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-build-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/partial-build/summary.tsv
            ${{ runner.temp }}/partial-build/*/build.log
      - name: Validate plain scRNA counts in independently built core
        if: matrix.target == 'core' || matrix.target == 'core-static'
        env:
          STAR_BIN: ${{ runner.temp }}/partial-build/${{ matrix.target }}/source/core/legacy/source/STAR
        run: python3 tests/test_scrna_gex_counts.py
